name: Docker Image CI

on:
  push:
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: "0 6 * * 1"   # every Monday at 06:00 UTC
  workflow_dispatch:
    inputs:
      opencode_ref:
        description: "opencode git revision to compile (blank = the pin in the Dockerfile)"
        required: false
        default: ""

jobs:
  check-base:
    # Scheduled runs only: decide whether debian:13-slim has changed
    # since the last published image.
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    outputs:
      changed: ${{ steps.compare.outputs.changed }}
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Current debian:13-slim digest
        id: current
        run: |
          digest=$(docker buildx imagetools inspect debian:13-slim --format '{{.Manifest.Digest}}')
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Base digest of the published image
        id: published
        run: |
          ref="docker.io/${{ github.repository_owner }}/opencode-llama-swap-aio:latest"
          base=$(docker buildx imagetools inspect "$ref" --format '{{ index .Image.Config.Labels "org.opencode.base-digest" }}' 2>/dev/null || echo "")
          echo "digest=$base" >> "$GITHUB_OUTPUT"
      - name: Compare digests
        id: compare
        run: |
          if [ "${{ steps.current.outputs.digest }}" != "${{ steps.published.outputs.digest }}" ]; then
            echo "New base detected: ${{ steps.current.outputs.digest }} (published: ${{ steps.published.outputs.digest }})"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "debian:13-slim unchanged; skipping rebuild."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    runs-on: ubuntu-latest
    needs: [check-base]
    # Always build on tags/PR/manual; on the cron, only if the base changed.
    if: |
      always() &&
      (github.event_name != 'schedule' || needs.check-base.outputs.changed == 'true')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Last commit
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
      - name: Base image digest
        id: base
        run: echo "digest=$(docker buildx imagetools inspect debian:13-slim --format '{{.Manifest.Digest}}')" >> "$GITHUB_OUTPUT"
      - name: Resolve opencode revision
        id: opencode
        # The Dockerfile ARG is the source of truth; a manual run may override it.
        run: |
          ref="${{ github.event.inputs.opencode_ref }}"
          if [ -z "$ref" ]; then
            ref=$(sed -n 's/^ARG OPENCODE_REF=\(.*\)$/\1/p' Dockerfile | head -1)
          fi
          echo "Compiling opencode from: $ref"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          # opencode is compiled from source inside the image, so this build is
          # a good deal slower than a plain apt/npm install — the first stage
          # runs a full `bun install` of the opencode monorepo.
          build-args: |
            OPENCODE_REF=${{ steps.opencode.outputs.ref }}
          tags: |
            docker.io/${{ github.repository_owner }}/opencode-llama-swap-aio:latest
            docker.io/${{ github.repository_owner }}/opencode-llama-swap-aio:${{ steps.vars.outputs.sha_short }}
          labels: |
            org.opencode.base-digest=${{ steps.base.outputs.digest }}
            org.opencode.ref=${{ steps.opencode.outputs.ref }}
      - name: Update Docker Hub Description
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          repository: ${{ github.repository_owner }}/opencode-llama-swap-aio
          readme-filepath: ./README.md
