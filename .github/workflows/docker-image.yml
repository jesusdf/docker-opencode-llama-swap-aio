name: Docker Image CI

on:
  push:
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: "0 6 * * 1"   # cada lunes a las 06:00 UTC
  workflow_dispatch:

jobs:
  check-base:
    # Solo en ejecuciones programadas: decide si debian:13-slim ha cambiado
    # desde la última imagen publicada.
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    outputs:
      changed: ${{ steps.compare.outputs.changed }}
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Digest actual de debian:13-slim
        id: current
        run: |
          digest=$(docker buildx imagetools inspect debian:13-slim --format '{{.Manifest.Digest}}')
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Digest base de la imagen publicada
        id: published
        run: |
          ref="docker.io/${{ github.repository_owner }}/opencode-llama-swap-aio:latest"
          base=$(docker buildx imagetools inspect "$ref" --format '{{ index .Image.Config.Labels "org.opencode.base-digest" }}' 2>/dev/null || echo "")
          echo "digest=$base" >> "$GITHUB_OUTPUT"
      - name: Comparar digests
        id: compare
        run: |
          if [ "${{ steps.current.outputs.digest }}" != "${{ steps.published.outputs.digest }}" ]; then
            echo "Nueva base detectada: ${{ steps.current.outputs.digest }} (publicada: ${{ steps.published.outputs.digest }})"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "debian:13-slim sin cambios; no se reconstruye."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    runs-on: ubuntu-latest
    needs: [check-base]
    # Se construye en tags/PR/manual siempre, y en el cron solo si la base cambió.
    if: |
      always() &&
      (github.event_name != 'schedule' || needs.check-base.outputs.changed == 'true')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Last commit
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
      - name: Base image digest
        id: base
        run: echo "digest=$(docker buildx imagetools inspect debian:13-slim --format '{{.Manifest.Digest}}')" >> "$GITHUB_OUTPUT"
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            docker.io/${{ github.repository_owner }}/opencode-llama-swap-aio:latest
            docker.io/${{ github.repository_owner }}/opencode-llama-swap-aio:${{ steps.vars.outputs.sha_short }}
          labels: |
            org.opencode.base-digest=${{ steps.base.outputs.digest }}
      - name: Update Docker Hub Description
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          repository: ${{ github.repository_owner }}/opencode-llama-swap-aio
          readme-filepath: ./README.md
